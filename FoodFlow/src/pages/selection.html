<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoodFlow | Selection</title>

    <link
      rel="shortcut icon"
      href="../imgs/fork-knife.svg"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="../styles/selection.css" />
  </head>
  <body>
    <main class="selection-container">
      <header class="main-header">
        <h1 class="main-header-title">Food Flow! How Are You?</h1>
        <p class="main-header-text">Choose your profile to continue</p>
        <a href="./orders.html" class="header-button">View All Your Orders</a>
      </header>

      <section class="selection" aria-label="Choose you perfil">
        <article class="profile-card">
          <figure class="profile-card-img">
            <img src="../imgs/waiter.jpg" alt="Waiter card" />
          </figure>

          <div class="profile-card-content">
            <span class="profile-card-number"> 01 </span>
            <h2 class="profile-card-title">Waiter</h2>
            <p class="profile-card-description">
              Manage tables and customer orders.
            </p>

            <a href="./waiter.html" class="redirect">
              <button type="button" class="profile-card-button">
                I'm Waiter
              </button>
            </a>
          </div>
        </article>

        <article class="profile-card">
          <figure class="profile-card-img">
            <img src="../imgs/chef.jpg" alt="Chef card" />
          </figure>

          <div class="profile-card-content">
            <span class="profile-card-number"> 02 </span>
            <h2 class="profile-card-title">Chef</h2>
            <p class="profile-card-description">
              Prepare orders and manage the kitchen.
            </p>

            <a href="./chef.html" class="redirect">
              <button type="button" class="profile-card-button">
                I'm Chef
              </button>
            </a>
          </div>
        </article>

        <article class="profile-card">
          <figure class="profile-card-img">
            <img src="../imgs/customer.jpg" alt="Customer card" />
          </figure>

          <div class="profile-card-content">
            <span class="profile-card-number"> 03 </span>
            <h2 class="profile-card-title">Customer</h2>
            <p class="profile-card-description">Order your favorite foods.</p>

            <a href="./customer.html" class="redirect">
              <button type="button" class="profile-card-button">
                I'm Customer
              </button>
            </a>
          </div>
        </article>
      </section>

      <footer class="main-footer">
        <span class="footer-line"></span>
        <p class="footer-text">Food Flow</p>
        <span class="footer-line"></span>
      </footer>
    </main>
  </body>
</html>
